name: Live claim check
# Every day, re-run every documented claim against the production URL, exactly as an evaluator's browser would,
# in fresh isolated demo sandboxes. Rules only (no AI quota is used). A failure turns the README badge red.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python scripts/verify_live.py https://brandora-omega-three.vercel.app
